<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Berth GitHub social preview (1280 x 640)</title>
<style>
html, body { margin: 0; }
body { width: 1280px; height: 640px; box-sizing: border-box; padding: 80px 88px; display: flex; align-items: center; justify-content: space-between; gap: 48px; background: #F3F3F3; color: #1A1A1A; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; overflow: hidden; }
.copy { display: flex; flex-direction: column; gap: 28px; width: 600px; }
.lockup { display: flex; align-items: center; gap: 20px; }
.word { font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-weight: 600; font-size: 96px; line-height: 1; letter-spacing: -0.025em; }
.tagline { font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.15; letter-spacing: -0.015em; }
.lede { font-size: 22px; line-height: 1.45; color: #424242; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.cmd, .meta { white-space: nowrap; }
.cmd { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 18px; padding: 10px 16px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D6D6D6; }
.meta { font-size: 16px; color: #5C5C5C; }
</style>
</head>
<body>
<div class="copy">
  <div class="lockup">
    <svg viewBox="0 0 96 96" width="88" height="88"><rect width="96" height="96" rx="21" fill="#0F6CBD"/><rect x="17" y="17" width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.5"/><rect x="51" y="17" width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.5"/><rect x="17" y="51" width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.5"/><rect x="51" y="51" width="28" height="28" rx="7" fill="#FFFFFF"/><circle cx="65" cy="65" r="5.5" fill="#0F6CBD"/></svg>
    <span class="word">Berth</span>
  </div>
  <div class="tagline">Your desktop, where you left it.</div>
  <div class="lede">Berth saves the positions of your Windows desktop icons and puts them back after a resolution change, a dock or an Explorer restart.</div>
  <div class="row">
    <span class="cmd">berth save</span>
    <span class="cmd">berth restore</span>
    <span class="meta">Windows 11 · tray app, window and CLI</span>
  </div>
</div>
