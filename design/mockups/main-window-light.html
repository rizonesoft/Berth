<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Berth main window and tray menu, light theme (mockup with sample data)</title>
<style>
html, body { margin: 0; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 40px; display: flex; gap: 32px; background: #DDE5EE; color: #1A1A1A; font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, sans-serif">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #F3F3F3; border: 1px solid #C8C8C8; border-radius: 8px; overflow: hidden; box-shadow: 0 24px 60px rgba(30,50,80,0.25)">
<div style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 14px; font-size: 12px">
<svg viewBox="0 0 96 96" width="16" height="16" aria-hidden="true"><rect width="96" height="96" rx="21" fill="#0F6CBD"/><rect x="17" y="17" width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.5"/><rect x="51" y="17" width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.5"/><rect x="17" y="51" width="28" height="28" rx="7" fill="#FFFFFF" fill-opacity="0.5"/><rect x="51" y="51" width="28" height="28" rx="7" fill="#FFFFFF"/></svg>
<span style="flex: 1">Berth</span>
<svg viewBox="0 0 138 40" width="138" height="40" aria-hidden="true"><path d="M18 20h10M64 15h10v10H64zM110 15l10 10M120 15l-10 10" fill="none" stroke="#1A1A1A" stroke-width="1"/></svg>
</div>
<div style="flex: 1; display: grid; grid-template-columns: 250px 1fr; min-height: 0">
<div style="padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid #E0E0E0">
<div style="font-size: 14px; font-weight: 600; padding: 8px 12px">Layouts</div>
<button style="display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 0; border-left: 3px solid #0F6CBD; border-radius: 4px; background: #E6E6E6; color: #1A1A1A; text-align: left"><span style="font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">Docked <span style="font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: #0F6CBD; color: #FFFFFF">Active</span></span><span style="font-size: 12px; color: #4F4F4F">2 monitors · 42 icons</span></button>
<button style="display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 0; border-left: 3px solid transparent; border-radius: 4px; background: transparent; color: #1A1A1A; text-align: left"><span style="font-size: 14px; font-weight: 600">Laptop only</span><span style="font-size: 12px; color: #5C5C5C">1 monitor · 42 icons</span></button>
<button style="display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 0; border-left: 3px solid transparent; border-radius: 4px; background: transparent; color: #1A1A1A; text-align: left"><span style="font-size: 14px; font-weight: 600">Meeting room</span><span style="font-size: 12px; color: #5C5C5C">2 monitors · 40 icons</span></button>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid #E0E0E0">
<span style="flex: 1; font-size: 13px">Restore automatically</span>
<button aria-pressed="true" aria-label="Restore automatically" style="width: 40px; height: 20px; padding: 0 3px; border-radius: 10px; border: 0; background: #0F6CBD; display: flex; align-items: center; justify-content: flex-end"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FFFFFF; display: block"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px">
<span style="flex: 1; font-size: 13px">Start with Windows</span>
<button aria-pressed="false" aria-label="Start with Windows" style="width: 40px; height: 20px; padding: 0 3px; border-radius: 10px; border: 1px solid #5C5C5C; background: #FFFFFF; display: flex; align-items: center; justify-content: flex-start; box-sizing: border-box"><span style="width: 12px; height: 12px; border-radius: 6px; background: #5C5C5C; display: block"></span></button>
</div>
</div>
<div style="padding: 12px 28px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 24px; font-weight: 600">Docked</h1><span style="font-size: 12px; color: #5C5C5C">2560 × 1440 and 1920 × 1080 · saved today, 09:14</span></div>
<button style="height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid #D0D0D0; background: #FFFFFF; color: #1A1A1A; font-size: 14px">Restore</button>
<button style="height: 36px; padding: 0 16px; border-radius: 4px; border: 0; background: #0F6CBD; color: #FFFFFF; font-size: 14px; font-weight: 600">Save current layout</button>
</div>
<svg viewBox="0 0 560 300" width="100%" role="img" aria-label="Map of the Docked layout: two monitors with every saved icon position plotted. One icon is selected." style="background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 6px; font-family: 'Cascadia Mono', Consolas, 'JetBrains Mono', monospace">
<defs><pattern id="plotl" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1A1A1A" stroke-opacity="0.07" stroke-width="1"/></pattern></defs>
<rect width="560" height="300" fill="url(#plotl)"/>
<rect x="24" y="40" width="300" height="170" rx="4" fill="#F3F3F3" stroke="#767676" stroke-width="1.5"/>
<rect x="330" y="82" width="206" height="128" rx="4" fill="#F3F3F3" stroke="#767676" stroke-width="1.5"/>
<text x="24" y="30" font-size="12" fill="#5C5C5C">1 · 2560 × 1440</text><text x="330" y="72" font-size="12" fill="#5C5C5C">2 · 1920 × 1080</text>
<rect x="36" y="52" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="36" y="72" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="36" y="92" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="36" y="112" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="36" y="132" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="36" y="152" width="11" height="11" rx="3" fill="#0F6CBD"/>
<rect x="56" y="52" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="56" y="72" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="56" y="92" width="11" height="11" rx="3" fill="#0F6CBD"/>
<rect x="76" y="52" width="11" height="11" rx="3" fill="#0F6CBD"/>
<rect x="300" y="52" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="300" y="72" width="11" height="11" rx="3" fill="#0F6CBD"/>
<rect x="342" y="94" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="342" y="114" width="11" height="11" rx="3" fill="#0F6CBD"/><rect x="512" y="186" width="11" height="11" rx="3" fill="#0F6CBD"/>
<rect x="194" y="126" width="11" height="11" rx="3" fill="#1A1A1A"/><rect x="188" y="120" width="23" height="23" rx="6" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
<path d="M199.5 143v97" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3 4"/>
<text x="24" y="258" font-size="13" fill="#1A1A1A">Notes.txt</text><text x="24" y="278" font-size="12" fill="#5C5C5C">x 1436 · y 702 · monitor 1</text>
<text x="536" y="278" font-size="12" fill="#5C5C5C" text-anchor="end">42 of 42 in place</text>
</svg>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E5E5E5; font-size: 14px">
<span style="width: 10px; height: 10px; border-radius: 3px; background: #0F6CBD; flex: none"></span>
<span style="flex: 1">Every icon is at its saved position.</span>
<span style="font-size: 12px; color: #5C5C5C">Checked 09:14</span>
</div>
</div>
</div>
</div>
<div style="width: 264px; flex: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #3F4B59">TRAY MENU</div>
<div style="display: flex; flex-direction: column; padding: 4px; background: #F9F9F9; border: 1px solid #C8C8C8; border-radius: 8px; box-shadow: 0 12px 32px rgba(30,50,80,0.25)">
<button style="height: 36px; padding: 0 12px 0 40px; border: 0; border-radius: 4px; background: transparent; color: #1A1A1A; font-size: 14px; text-align: left">Save layout</button>
<button style="height: 36px; padding: 0 12px 0 40px; border: 0; border-radius: 4px; background: #EAEAEA; color: #1A1A1A; font-size: 14px; text-align: left">Restore layout</button>
<button aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #1A1A1A; font-size: 14px; text-align: left; display: flex; align-items: center; gap: 12px"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#0F6CBD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Restore automatically</button>
<div style="height: 1px; margin: 4px 0; background: #DADADA"></div>
<button style="height: 36px; padding: 0 12px 0 40px; border: 0; border-radius: 4px; background: transparent; color: #1A1A1A; font-size: 14px; font-weight: 600; text-align: left">Open Berth</button>
<button style="height: 36px; padding: 0 12px 0 40px; border: 0; border-radius: 4px; background: transparent; color: #1A1A1A; font-size: 14px; text-align: left">Exit</button>
</div>
<div style="align-self: flex-end; display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 6px; background: #EEF2F6; border: 1px solid #C8C8C8">
<span style="width: 32px; height: 32px; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 96 96" width="16" height="16" role="img" aria-label="Berth tray icon"><rect x="6" y="6" width="38" height="38" rx="9" fill="#1A1A1A" fill-opacity="0.45"/><rect x="52" y="6" width="38" height="38" rx="9" fill="#1A1A1A" fill-opacity="0.45"/><rect x="6" y="52" width="38" height="38" rx="9" fill="#1A1A1A" fill-opacity="0.45"/><rect x="52" y="52" width="38" height="38" rx="9" fill="#0F6CBD"/></svg></span>
<span style="font-size: 12px; color: #3F4B59; padding: 0 6px">Notification area</span>
</div>
</div>
</div>
</body>
</html>
